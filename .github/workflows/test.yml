name: Test Parser

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
    
    - uses: pnpm/action-setup@v6
      with:
        version: 11
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Build schema
      run: pnpm run build:schema
    
    - name: Run validation tests
      run: pnpm test
