name: Reusable Songbook Validation

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        default: '18'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - uses: pnpm/action-setup@v3
      with:
        version: 8
    
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    
    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    
    - run: pnpm install
    - run: pnpm run build
    
    - name: Run validation
      id: test
      run: |
        set -o pipefail
        pnpm run test 2>&1 | tee test-output.txt
      continue-on-error: true
    
    - name: Test authors list
      id: test-authors
      if: hashFiles('authors.log') != ''
      run: |
        set -o pipefail
        pnpm run test:authors 2>&1 | tee test-authors-output.txt
      continue-on-error: true
      
    - name: Comment validation errors on PR
      if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const output = fs.readFileSync('test-output.txt', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ❌ Validation Failed\n\n<details><summary>Error Details</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`
          });
    
    - name: Comment authors changes on PR
      if: steps.test-authors.outcome == 'failure' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const output = fs.readFileSync('test-authors-output.txt', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ❌ Authors List Changed\n\n\`\`\`diff\n${output}\n\`\`\`\n\nUpdate the baseline: \`npm run update-authors\``
          });
      
    - if: steps.test.outcome == 'failure' || steps.test-authors.outcome == 'failure'
      run: exit 1
